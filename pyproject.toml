[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q-grid"
version = "0.1.0"
description = "Noise-Aware Quantum-Classical Optimization for Energy-Efficient Data Center Job Assignment"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Q-Grid Contributors"}
]
requires-python = ">=3.12"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.16",
    "ortools>=9.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"