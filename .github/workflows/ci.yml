name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=long 2>&1 | tee /tmp/pytest_output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /tmp/pytest_output.txt
          retention-days: 3

  test-windows:
    name: Test suite (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # Use bash (Git Bash, pre-installed on windows-latest) to leverage
        # `set -o pipefail` for preserving the pytest exit code through the tee pipe.
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=long 2>&1 | tee pytest_output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-windows
          path: pytest_output.txt
          retention-days: 3
